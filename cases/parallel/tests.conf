# cases/parallel/tests.conf —— np 无关性验证测试清单
#
# 格式（`|` 分隔，9 列，前后空白自动去掉）：
#   name | case_dir | mesh | bc | material | nblocks | np_list | steps | overrides
#
#   name      测试名（也是 runs/<name>/ 目录名；命令行参数按前缀过滤）
#   case_dir  算例目录（相对仓库根；只用其中已入库的网格/边界/物性文件）
#   mesh      Mesh3d.x（$control_ec: Mesh_File_Format=2，Fortran unformatted）
#   bc        bc3d.inp
#   material  material.in
#   nblocks   全局块数（必须与 mesh 一致，驱动脚本会核对）
#   np_list   要跑的进程数（逗号分隔，必须含 1 = 参考解）
#   steps     外步数（t_end=Kstep_save=steps，Kstep_show=steps，只写最后一次）
#   overrides 额外的 "KEY=VAL,KEY=VAL"（可空）：base control.ec 里已有的键就地替换，
#             没有的键按前缀归到 $flow_ec/$ac_ec/$lowspeed_ec/$solid_ec/$porous_ec/$couple_ec
#             组追加（gen_control.py 负责；base 里已存在同名组时直接报错，避免重复组）
#
# 全部算例都用 AC（LS_Algorithm=3, AC_MPI_Sync=1）：这是 P0–P2 已验证的并行路径，
# t01/t02 是 P3（固体）/P4（码 12）/P5（码 19）/P6（码 14/18）加入前的基线。

# 2 块 AC 槽道（进口/出口 ⇒ 有压力边界；1 条 i 界面）
# AC_Max_Iter=1 是项目里多块 AC 的 np 无关性配方（每个外步只推 1 个伪步，np=1 的
# "逐伪步刷鬼点"与 np>1 的节奏一致；见 cases/lidcavity_ac_3blk/README.md）。
# 该算例自带 control.ec 是 AC_Max_Iter=20 的单进程配方，这里必须覆盖掉。
t01_two_ac   | cases/channel_ac_2blk     | Mesh3d.x     | bc3d.inp     | material.in    | 2 | 1,2     | 10000 | AC_MPI_Sync=1,AC_Max_Iter=1

# 4 块 AC 方腔（全封闭 ⇒ 压力靠全局 1 号块锚定；2 条 i 面 + 1 条 j 面）
# 该算例总控（cases/lidcavity_ac_46blk/control.ec）本来就是 AC_Max_Iter=1 + AC_Tol=1e-7，
# 这里显式写死，避免总控被改动后测试含义漂移。
t02_four_ac  | cases/lidcavity_ac_46blk  | Mesh3d_m4a.x | bc3d_m4a.inp | material_m4.in | 4 | 1,2,3,4 | 10000 | AC_MPI_Sync=1,AC_Max_Iter=1
#
# 关于步数：np=1 与 np>1 的界面推进方式不同（np=1 逐伪步刷鬼点 = 块 Gauss-Seidel；
# np>1 只在每个外步末换一次 = Jacobi），**瞬态轨迹**本来就会差，差异随迭代衰减。
# 实测（wuzh02，gfortran 7.3.1）：2000 步 max|du| ≈ 4e-5（t01）/9e-4（t02），
# 10000 步衰减到 4.0e-6 / 1.4e-6（压力去常数 2.3e-6 / 1.2e-6），np>1 之间逐位相同。
# 所以默认跑 10000 步 + 默认阈值 (1e-5/5e-6/5e-6/1e-6)；冒烟用
#   STEPS=2000 TOLVEL=1e-3 TOLRMS=1e-4 TOLP=1e-3 TOLT=1e-3 bash run_para_verify.sh
